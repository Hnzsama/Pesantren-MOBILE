name: pesantren_mobile
description: "Aplikasi Wali Santri untuk memantau saldo, tagihan, aktivitas, dan perkembangan santri secara real-time."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  intl: ^0.20.2
  youtube_player_flutter: ^9.1.3
  midtrans_sdk: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
